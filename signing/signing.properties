# Ключ для сборок «для себя» (debug, CI, sideload). Он лежит в репозитории намеренно:
# одинаковая подпись на всех машинах => APK ставится ПОВЕРХ предыдущей версии, данные сохраняются.
# Для Google Play используйте отдельный ключ: android/keystore.properties (см. docs/PUBLISHING.md).
storeFile=signing/filedeck-sideload.jks
storeType=pkcs12
storePassword=filedeck-sideload
keyAlias=filedeck
keyPassword=filedeck-sideload
