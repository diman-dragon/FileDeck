import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// ---------------------------------------------------------------- версия
// Единственный источник правды — "version" в package.json (npm run bump patch|minor|major).
// versionCode = major*10000 + minor*100 + patch → каждая новая версия строго больше предыдущей,
// поэтому Android ставит её как обновление, а не как новое приложение.
def pkg = new JsonSlurper().parse(rootProject.file('../package.json'))
def versionParts = pkg.version.tokenize('.')
def computedVersionCode = versionParts[0].toInteger() * 10000 + versionParts[1].toInteger() * 100 + versionParts[2].toInteger()

// ---------------------------------------------------------------- подпись
// 1) sideload-ключ из репозитория — для debug/CI/установки «для себя» (один и тот же на всех машинах);
// 2) android/keystore.properties (если создан) — ваш личный ключ для Google Play / публичных релизов.
def sideloadPropsFile = rootProject.file('signing/signing.properties')
def sideloadProps = new Properties()
if (!sideloadPropsFile.exists() || !rootProject.file('signing/filedeck-sideload.jks').exists()) {
    throw new GradleException(
        'Нет ключа подписи android/signing/ (filedeck-sideload.jks и signing.properties). ' +
        'Без него APK подпишется случайным ключом и не обновится поверх установленной версии. ' +
        'Верните папку android/signing/ из репозитория или архива.')
}
sideloadPropsFile.withInputStream { sideloadProps.load(it) }
def storePropsFile = rootProject.file('keystore.properties')
def storeProps = new Properties()
if (storePropsFile.exists()) {
    storePropsFile.withInputStream { storeProps.load(it) }
}

android {
    namespace = "dev.filedeck.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.filedeck.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computedVersionCode
        versionName pkg.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        sideload {
            storeFile rootProject.file(sideloadProps['storeFile'])
            storeType sideloadProps['storeType']
            storePassword sideloadProps['storePassword']
            keyAlias sideloadProps['keyAlias']
            keyPassword sideloadProps['keyPassword']
        }
        if (storePropsFile.exists()) {
            store {
                storeFile rootProject.file(storeProps['storeFile'])
                storePassword storeProps['storePassword']
                keyAlias storeProps['keyAlias']
                keyPassword storeProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.sideload
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig storePropsFile.exists() ? signingConfigs.store : signingConfigs.sideload
        }
    }
    bundle {
        language { enableSplit = false }
    }
    packaging {
        resources {
            // библиотеки архивации приносят одинаковые служебные файлы — берём первый, чтобы сборка не падала
            pickFirsts += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST']
            excludes += ['META-INF/versions/**', 'META-INF/*.kotlin_module']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Архиватор: ZIP (пароль AES-256), 7z / TAR / GZ / BZ2 / XZ, RAR (распаковка)
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    implementation 'org.apache.commons:commons-compress:1.26.2'
    implementation 'org.tukaani:xz:1.9'
    implementation 'com.github.junrar:junrar:7.5.5'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
