# Версия приложения — единственный источник правды.
# ПРАВИЛО: любое исправление или изменение = новая версия (патч +1: 0.0.8 → 0.0.9 → …). Не оставлять прежний номер.
# Каждое изменение записывается в CHANGELOG.md под новой версией.
# versionCode = major*10000 + minor*100 + patch, поэтому каждая новая версия ставится поверх прежней.
app.version=0.0.8

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
