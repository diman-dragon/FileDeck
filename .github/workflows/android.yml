name: Android

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка (веб + sync + APK и AAB)
        run: npm run release
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        with:
          name: filedeck-${{ github.sha }}
          path: release/*
