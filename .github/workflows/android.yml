name: Android

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Права на gradlew
        run: chmod +x gradlew

      - name: Тесты
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug
        continue-on-error: true

      - name: Сборка APK и AAB
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Собрать файлы
        run: |
          VERSION=$(grep '^app.version=' gradle.properties | cut -d= -f2)
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/filedeck-${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "release/filedeck-${VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release/filedeck-${VERSION}.aab"
          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: filedeck-${{ github.sha }}
          path: release/*

      - name: Релиз на GitHub (по тегу v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
